let W=0,H=0,scale=1,player,obstacles,score,best=0,started=false,over=false,frame=0,stars=[];
function resize(){const r=c.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;scale=Math.min(W/390,H/680);reset();}
function reset(){player={x:W*.27,y:H*.46,vy:0,r:Math.max(12,15*scale)};obstacles=[];score=0;started=false;over=false;frame=0;stars=Array.from({length:35},()=>({x:Math.random()*W,y:Math.random()*H*.8,s:1+Math.random()*2}));}
function flap(){if(over){reset();return}if(!started)started=true;player.vy=-4.5*scale;}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawBg(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cbe8eb');g.addColorStop(1,'#f4d9e4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{ctx.globalAlpha=.3;rect(s.x,s.y,s.s,s.s,'#fff');ctx.globalAlpha=1});
 // soft pixel clouds
 for(let i=0;i<4;i++){let x=((i*137-frame*.25)%(W+100)+W+100)%(W+100)-45,y=H*(.16+(i%3)*.1);rect(x,y,42,9,'#ffffff88');rect(x+9,y-7,23,8,'#ffffff88');rect(x+17,y+8,31,6,'#ffffff88')}
 rect(0,H-32,W,32,'#a9c8a0');rect(0,H-32,W,4,'#d6e8b8');for(let x=0;x<W;x+=18)rect(x,H-20,8,3,'#8bb38a');
}
function pipe(p){
 const gap=H*.27, topH=p.gapY-gap/2, botY=p.gapY+gap/2, pw=48*scale;
 // pastel candy pipes
 rect(p.x,0,pw,topH,'#8e6a9f');rect(p.x-4,topH-13,pw+8,13,'#d88cb9');rect(p.x+5,0,5,Math.max(0,topH-13),'#b9a0c5');
 rect(p.x,botY,pw,H-botY-32,'#8e6a9f');rect(p.x-4,botY,pw+8,13,'#d88cb9');rect(p.x+5,botY+13,5,H-botY-45,'#b9a0c5');
}
function drawGirl(){
 const s=player, size=78*scale;
 if(sprite.complete && sprite.naturalWidth){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(sprite,s.x-size*.45,s.y-size*.62,size*.9,size*1.24);ctx.restore();}
 else {rect(s.x-12,s.y-15,24,30,'#714050');rect(s.x-9,s.y-10,18,17,'#e9b9a9');rect(s.x-18,s.y-4,8,14,'#ff9bc8');rect(s.x+10,s.y-4,8,14,'#ff9bc8')}
}
function text(str,y,size=20){ctx.fillStyle='#422c4d';ctx.font=`900 ${size*scale}px system-ui`;ctx.textAlign='center';ctx.shadowColor='#fff9';ctx.shadowBlur=5;ctx.fillText(str,W/2,y);ctx.shadowBlur=0}
function overlay(title,sub){ctx.fillStyle='#fff9';ctx.fillRect(18,H*.34,W-36,H*.25);ctx.strokeStyle='#f0a9cc';ctx.lineWidth=3;ctx.strokeRect(18,H*.34,W-36,H*.25);text(title,H*.43,25);text(sub,H*.49,12);text('✦',H*.56,18)}
function tick(){
 frame++;drawBg();
 if(started&&!over){
   player.vy+=.22*scale;player.y+=player.vy*scale;
   if(frame%95===1)obstacles.push({x:W+10,gapY:H*(.32+Math.random()*.38),passed:false});
   obstacles.forEach(p=>{p.x-=2.25*scale;pipe(p);
     const gap=H*.27,pw=48*scale, topH=p.gapY-gap/2,botY=p.gapY+gap/2;
     if(player.x+10*scale>p.x&&player.x-10*scale<p.x+pw&&(player.y-14*scale<topH||player.y+14*scale>botY))over=true;
     if(!p.passed&&p.x+pw<player.x){p.passed=true;score++;best=Math.max(best,score)}
   });
   obstacles=obstacles.filter(p=>p.x>-70);
   if(player.y<H*.02||player.y>H-45)over=true;
 }
 obstacles.forEach(pipe);drawGirl();
 if(!started){overlay('FLAPPY MILENA','тапни, чтобы начать полёт')}
 else if(over){overlay('ОЙ, УПС!','счёт: '+score+'  ·  тапни, чтобы ещё раз')}
 else {ctx.textAlign='center';ctx.fillStyle='#422c4d';ctx.font=`900 ${32*scale}px system-ui`;ctx.fillText(score,W/2,H*.12);ctx.font=`600 ${11*scale}px system-ui`;ctx.fillText('РЕКОРД '+best,W/2,H*.12+18*scale)}
 requestAnimationFrame(tick);
}
c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
